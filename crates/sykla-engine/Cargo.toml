[package]
name = "sykla-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "sykla_engine"
path = "src/lib.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[[example]]
name = "demo"
path = "examples/demo.rs"
