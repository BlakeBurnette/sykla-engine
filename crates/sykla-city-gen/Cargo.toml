[package]
name = "sykla-city-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sykla-city-gen"
path = "src/main.rs"

[dependencies]
sykla-core = { path = "../sykla-core" }
sykla-world = { path = "../sykla-world" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
earcutr = "0.4"
clap = { version = "4", features = ["derive"] }
bincode = "1"
