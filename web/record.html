<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sykla — Record Ride</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; }

        #map { width: 100%; height: 50vh; }

        .panel { padding: 16px; }

        /* Metrics grid */
        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .metric {
            background: #2a2a4e;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
        .metric-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .controls button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .controls button:disabled { opacity: 0.3; cursor: default; }
        #btn-start { background: #2ecc71; }
        #btn-pause { background: #f39c12; }
        #btn-stop { background: #e74c3c; }

        /* Sensors */
        .sensors {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .sensor-btn {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #aaa;
            transition: all 0.2s;
        }
        .sensor-btn.connected {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        /* Status */
        #rec-status {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Import section */
        .import-section {
            border-top: 1px solid #333;
            padding-top: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .import-section input[type="file"] {
            flex: 1;
            font-size: 13px;
            color: #aaa;
        }
        .import-section button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4a90d9;
            color: white;
        }

        /* Activity name */
        .name-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2a2a4e;
            color: #fff;
        }
        .name-input::placeholder { color: #666; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="panel">
        <div id="rec-status">Ready to ride</div>

        <div class="metrics">
            <div class="metric">
                <div class="metric-value" id="metric-speed">--</div>
                <div class="metric-label">km/h</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="metric-distance">0.00</div>
                <div class="metric-label">km</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="metric-time">0:00</div>
                <div class="metric-label">time</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="metric-hr">--</div>
                <div class="metric-label">bpm</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="metric-cadence">--</div>
                <div class="metric-label">rpm</div>
            </div>
            <div class="metric">
                <div class="metric-value" id="metric-power">--</div>
                <div class="metric-label">watts</div>
            </div>
        </div>

        <input type="text" class="name-input" id="activity-name" placeholder="Activity name (optional)">

        <div class="controls">
            <button id="btn-start" onclick="syklaRecord.startRecording()">Start</button>
            <button id="btn-pause" onclick="syklaRecord.pauseRecording()" disabled>Pause</button>
            <button id="btn-stop" onclick="syklaRecord.stopRecording()" disabled>Stop</button>
        </div>

        <div class="sensors">
            <button class="sensor-btn" id="sensor-hrm" onclick="syklaSensors.connectHRM()">HRM</button>
            <button class="sensor-btn" id="sensor-csc" onclick="syklaSensors.connectSpeedCadence()">Speed/Cad</button>
            <button class="sensor-btn" id="sensor-power" onclick="syklaSensors.connectPowerMeter()">Power</button>
        </div>

        <div class="import-section">
            <input type="file" id="gpx-file" accept=".gpx">
            <button onclick="syklaRecord.importGPX()">Import GPX</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="sensors.js"></script>
    <script src="record.js"></script>
</body>
</html>
