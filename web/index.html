<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sykla — Ride the World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        #sykla-canvas { width: 100%; height: 100%; display: block; }
        #connect-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4a90d9;
            color: white;
            transition: background 0.2s;
        }
        #connect-btn:hover { background: #357abd; }
        #connect-btn.connected { background: #2ecc71; }
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #aaa;
            font-family: monospace;
            font-size: 14px;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            color: #888;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            background: rgba(0,0,0,0.6);
            padding: 12px 16px;
            border-radius: 8px;
            pointer-events: none;
        }
        #controls kbd {
            background: #444;
            color: #ddd;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="status">Sykla Loading...</div>
    <button id="connect-btn" onclick="syklaBle.connectTrainer()">Connect Trainer</button>
    <div id="controls">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Arrows — Move &amp; Turn<br>
        <kbd>Space</kbd> / <kbd>Q</kbd> — Up &nbsp; <kbd>E</kbd> — Down<br>
        <kbd>T</kbd> — Look up &nbsp; <kbd>G</kbd> — Look down<br>
        <kbd>Shift</kbd> — Sprint &nbsp; <kbd>R</kbd>/<kbd>F</kbd> — Speed ±
    </div>
    <canvas id="sykla-canvas"></canvas>

    <script src="ble.js"></script>
    <script type="module">
        import init from './dist/sykla_web.js';
        init().then(() => {
            document.getElementById('status').textContent = '';
        }).catch(err => {
            // Bevy uses exceptions for control flow in WASM — not a real error
            const msg = String(err);
            if (msg.includes('Using exceptions for control flow')) {
                document.getElementById('status').textContent = '';
            } else {
                document.getElementById('status').textContent = 'Error: ' + err;
            }
        });
    </script>
</body>
</html>
